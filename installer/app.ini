; Settings for packaging one PHP + MySQL application as a Windows setup.exe.
; To package another app: copy this installer\ folder into that app's repository root, edit this
; file (at least [app], [database], [php], [env]) and double-click build.bat. See README.md.
; build.bat updates [release] on every build: commit this file afterwards.

[app]
name=Perfect LPG
publisher=Perfect LPG
; Unique per application (Inno Setup AppId). Generate a new GUID for every new app and never change it afterwards.
id=B7E1C2D4-5F60-4A8B-9C3D-2E4F6A8B0C1D
; No spaces. Used for the default folder (C:\<short_name>) and the services <short_name>-Apache / <short_name>-MySQL.
short_name=PerfectLPG
; Web root, relative to the app folder.
document_root=public
; Folders (relative to the app folder) whose contents belong to the client: shipped once, never
; replaced or removed by upgrades. Comma-separated.
keep=writable
; Folders created inside the app folder on every install. Comma-separated.
create_dirs=writable\cache,writable\logs,writable\session,writable\uploads,writable\debugbar,writable\backups
; Page opened after a new install while the database is still empty (blank = home page), and the
; page that must answer HTTP 200 after an install or upgrade.
first_run_path=installation
health_path=login
default_port=80
; The app's settings file, relative to the app folder, and how lines are written: 1 = "key = value", 0 = "key=value".
env_file=.env
env_spaces=1

; Written by build.bat.
[release]
version=1.0.1
notes=1.0.1
built=2026-10-28 11:05
commit=f470c1a

; Server lines the app is tested on. A different line makes the next setup.exe download and install
; the newest patch of that line on every client (Apache is always 2.4). An upgrade where these still
; match replaces only the app code.
[requires]
php=8.5
mysql=8.4

[build]
; Relative to the repository root.
icon=public\favicon.ico
; 1 = run "composer install --no-dev" on the staged copy.
composer=1
; Repository paths (regex on git's forward-slash paths) left out of setup.exe. installer/ is always left out.
exclude=^(tests|node_modules|docs|\.github|\.githooks)/|^(package(-lock)?\.json|playwright\.config\.mjs|phpunit\.dist\.xml|env|\.gitattributes|\.gitignore)$|^[^/]+\.md$

[database]
name=perfect_lpg
user=lpg_app
; 1 = setup creates the empty database; 0 = the app creates it (here: on its Installation page).
create=0

[php]
; Extensions enabled in php.ini, and the ones setup checks actually load.
extensions=curl,exif,fileinfo,gd,intl,mbstring,mysqli,openssl,pdo_mysql,sodium,zip
required_extensions=curl,intl,mbstring,mysqli,openssl,zip

; Written into php.ini as-is.
[php.ini]
date.timezone=Asia/Karachi
memory_limit=512M
max_execution_time=300
upload_max_filesize=512M
post_max_size=520M
opcache.enable=1
opcache.revalidate_freq=2

[license]
; 1 = setup.exe asks for a key that works on one computer only (issued with license\keygen.bat),
; and every web request is checked against it. Fixed into setup.exe at build time: editing the
; installed copy of this file on a client changes nothing.
enabled=0
; The app's PHP entry files (relative to the app folder, comma-separated). The build adds a second
; license check to the top of each, in the shipped copy only (the repository is not changed).
entry_points=public/index.php

; Settings written to env_file. [env.first] only when the file is created; [env] on every install
; and upgrade. A line is skipped when one of its placeholders is empty. Placeholders:
;   {base_url} {install_dir} {app_dir} {backup_dir} {mysql} {mysqldump} {company} {app_version}
;   {db_host} {db_port} {db_name} {db_user} {db_password}
;   {db_empty} = true while the database has no tables, else false
;   {random_hex32} {random_base64_32} = 32 random bytes (for encryption keys)
[env.first]
CI_ENVIRONMENT=production
encryption.key=hex2bin:{random_hex32}
database.default.hostname={db_host}
database.default.database={db_name}
database.default.username={db_user}
database.default.password='{db_password}'
database.default.DBDriver=MySQLi
diagnostics.enabled=false

[env]
FRESH_DATABASE_SETUP={db_empty}
app.baseURL='{base_url}'
database.default.port={db_port}
backup.directory='{backup_dir}'
backup.mysqldumpPath='{mysqldump}'
backup.mysqlPath='{mysql}'
app.companyName='{company}'
